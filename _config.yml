# Configuração do site L.LIMA (Jekyll, compilado automaticamente pelo GitHub Pages)
# Depois de alterar este arquivo, o GitHub Pages republica o site em 1 a 2 minutos.

title: "L.LIMA Projetos e Soluções Industriais"
url: "https://llimasolucoes.com.br"
baseurl: ""
lang: pt-BR
timezone: America/Sao_Paulo

# ------------------------------------------------------------------
# Formulário de contato (página /contato/)
# TROCAR PELO ID DO FORMSPREE: crie o formulário em https://formspree.io
# com o e-mail leonardo@llimasolucoes.com.br e substitua "SEU_ID" abaixo
# pelo código que o Formspree mostrar (ex.: https://formspree.io/f/xabcdwxy).
# Enquanto estiver "SEU_ID", o formulário envia pelo programa de e-mail do visitante.
formspree_endpoint: "https://formspree.io/f/SEU_ID"
# ------------------------------------------------------------------

markdown: kramdown
permalink: pretty

exclude:
  - COMO-EDITAR.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - tools
