<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L.LIMA | Projetos e Soluções Industriais</title>
<meta name="description" content="L.LIMA Projetos e Soluções Industriais: engenharia, automação robótica, adequação à NR-12, usinagem e caldeiraria. Site em construção.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --blue: #0A3A7A; --red: #C62828; --gray: #6E6E6E; --line: #E3E8EF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Lato', Arial, sans-serif;
    background: #FFFFFF;
    color: #17212B;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
  }
  .logo { width: min(440px, 82vw); height: auto; }
  .bar { display: flex; width: 120px; height: 4px; margin: 40px auto 32px; }
  .bar span:first-child { flex: 1; background: var(--red); }
  .bar span:last-child { flex: 2; background: var(--blue); }
  h1 {
    font-weight: 900;
    font-size: clamp(26px, 5vw, 40px);
    color: var(--blue);
    letter-spacing: 0.5px;
  }
  p.lead {
    margin-top: 14px;
    max-width: 560px;
    font-size: clamp(16px, 2.4vw, 18px);
    line-height: 1.55;
    color: var(--gray);
  }
  .contact {
    margin-top: 36px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
    justify-content: center;
    font-size: 16px;
  }
  .contact a { color: var(--blue); text-decoration: none; font-weight: 700; }
  .contact a:hover { text-decoration: underline; }
  footer {
    border-top: 1px solid var(--line);
    padding: 18px 24px;
    text-align: center;
    font-size: 13px;
    color: var(--gray);
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="L.LIMA Projetos e Soluções Industriais" width="900" height="288">
    <div class="bar" aria-hidden="true"><span></span><span></span></div>
    <h1>Site em construção</h1>
    <p class="lead">Em breve, mais informações sobre nossos serviços de engenharia, automação robótica, adequação à NR-12, usinagem e caldeiraria.</p>
    <div class="contact">
      <a href="mailto:leonardo@llimasolucoes.com.br">leonardo@llimasolucoes.com.br</a>
      <a href="tel:+5511951360265">(11) 95136-0265</a>
    </div>
  </main>
  <footer>L. LIMA Projetos e Soluções Industriais · Diadema - SP</footer>
</body>
</html>
