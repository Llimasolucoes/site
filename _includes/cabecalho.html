{%- assign servicos = site.pages | where: "layout", "servico" | sort: "ordem" -%}
{%- assign url = page.url -%}
<header class="topo">
  <div class="container topo__barra">
    <a class="topo__logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/llima-logo.webp' | relative_url }}" alt="L.LIMA Projetos e Soluções Industriais: página inicial" width="450" height="144">
    </a>
    <button class="menu-botao" type="button" aria-expanded="false" aria-controls="menu-principal">
      <span class="menu-botao__abrir">{% include icone.html nome="menu" %}</span>
      <span class="menu-botao__fechar">{% include icone.html nome="fechar" %}</span>
      <span class="menu-botao__texto">Menu</span>
    </button>
    <nav id="menu-principal" class="menu" aria-label="Menu principal">
      <ul class="menu__lista">
        <li><a href="{{ '/' | relative_url }}"{% if url == '/' %} aria-current="page"{% endif %}>Início</a></li>
        <li class="menu__sub">
          <div class="menu__sub-linha">
            <a href="{{ '/servicos/' | relative_url }}"{% if url == '/servicos/' %} aria-current="page"{% elsif url contains '/servicos/' %} class="ativo"{% endif %}>Serviços</a>
            <button class="submenu-botao" type="button" aria-expanded="false" aria-controls="submenu-servicos">
              <span class="sr">Mostrar lista de serviços</span>{% include icone.html nome="chevron" tamanho="18" %}
            </button>
          </div>
          <ul id="submenu-servicos" class="submenu">
            {%- for s in servicos %}
            <li><a href="{{ s.url | relative_url }}"{% if url == s.url %} aria-current="page"{% endif %}>{{ s.nome }}</a></li>
            {%- endfor %}
          </ul>
        </li>
        <li><a href="{{ '/projetos/' | relative_url }}"{% if url == '/projetos/' %} aria-current="page"{% endif %}>Projetos</a></li>
        <li><a href="{{ '/conteudos/' | relative_url }}"{% if url == '/conteudos/' %} aria-current="page"{% endif %}>Conteúdos</a></li>
        <li><a href="{{ '/sobre/' | relative_url }}"{% if url == '/sobre/' %} aria-current="page"{% endif %}>Sobre</a></li>
        <li><a href="{{ '/contato/' | relative_url }}"{% if url == '/contato/' %} aria-current="page"{% endif %}>Contato</a></li>
      </ul>
      <a class="botao botao--primario menu__cta" href="{{ '/contato/' | relative_url }}" data-umami-event="Solicitar orçamento - menu" data-umami-event-pagina="{{ page.url }}">Solicitar orçamento</a>
    </nav>
  </div>
</header>
